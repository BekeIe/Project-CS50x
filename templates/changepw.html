{% extends "layout.html" %}

{% block title %}
    Change Password
{% endblock %}

{% block main %}
    <h2>Change Your Password</h2>

    <div class="">
        <form action="/changepw" method="post">
            <input autocomplete="off" name="oldpassword" placeholder="Original Password" type="password">
            <p></p>
            <input autocomplete="off" name="newpassword" placeholder="New Password" type="password">
            <p></p>
            <button type="submit">Change</button>
        </form>
    </div>
{% endblock %}

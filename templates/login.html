{% extends "layout.html" %}

{% block title %}
    Log In
{% endblock %}

{% block main %}
    <h2>Log In</h2>

    <form action="/login" method="post">
        <input autocomplete="off" name="username" placeholder="Username" type="text">
        <input autocomplete="off" name="password" placeholder="Password" type="password">
        <button type="submit">Log In</button>
    </form>
{% endblock %}
